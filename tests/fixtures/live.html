<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>课堂哨合成直播验收</title><style>body{margin:0;background:#eff3f0;color:#203243;font:16px sans-serif}header{padding:20px 30px}canvas{width:1000px;height:600px;margin:0 30px;background:#fff;display:block}button{margin:20px 0 0 30px;padding:10px 20px}</style><header>演示课程 · 合成测试画面</header><canvas id="screen" width="1500" height="900"></canvas><button id="show">显示二维码</button><button id="hide">隐藏二维码</button><button id="refresh">刷新二维码内容</button><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let shown=false,revision=0;
const images=['a','b','c'].map(name=>{const image=new Image();image.src='../private/'+name+'.png';return image;});
document.querySelector('#show').onclick=()=>shown=true;document.querySelector('#hide').onclick=()=>shown=false;document.querySelector('#refresh').onclick=()=>{revision++;shown=true;};
setInterval(()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,1500,900);ctx.fillStyle='#203243';ctx.font='32px sans-serif';ctx.fillText('课程直播检测测试',80,80);ctx.font='20px monospace';ctx.fillText(new Date().toISOString(),80,130);ctx.font='26px sans-serif';ctx.fillText('第一节：背景监控与提醒',80,210);if(shown){ctx.drawImage(images[revision%2],220,300,310,310);ctx.drawImage(images[2],920,300,310,310);}else{ctx.fillStyle='#d7e3db';for(let i=0;i<5;i++)ctx.fillRect(80,270+i*80,1000-i*90,25);}},40);
</script></html>
